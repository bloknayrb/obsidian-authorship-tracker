name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Lint, typecheck (against the real Obsidian API), typecheck the tests
      # (against the mock), and run the suite. Defined in package.json so CI, the
      # release workflow, and contributors all run exactly the same checks.
      - name: Verify
        run: npm run verify

      - name: Build
        run: node esbuild.config.mjs production
